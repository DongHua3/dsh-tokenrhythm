<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="chTitle chDesc">
  <title id="chTitle">五家渠道只保留一家</title>
  <desc id="chDesc">上游包含 stepfun、zcode、tierflow、opencsg、tokenrhythm 五家渠道；本项目删掉前四家，只保留 tokenrhythm。</desc>

  <rect width="1200" height="380" rx="26" fill="#F7F8FA"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="25.25" fill="none" stroke="#E4E7EC" stroke-width="1.5"/>

  <g id="heading">
    <text x="64" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#12141A" letter-spacing="-0.6">只有一家渠道</text>
    <text x="64" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3B424E">上游装了五家平台，这份只剩基元律动：模块、路由、页签、外链一起删掉。</text>
  </g>

  <g id="sources">
    <g id="chip-stepfun">
      <rect x="64" y="150" width="150" height="46" rx="10" fill="#F1F3F6" stroke="#E4E7EC" stroke-width="1"/>
      <text x="139.0" y="179" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" fill="#9AA1AC">stepfun</text>
      <line x1="97.2" y1="175" x2="180.8" y2="175" stroke="#C4CAD5" stroke-width="1.6"/>
    </g>
    <g id="chip-zcode">
      <rect x="222" y="150" width="150" height="46" rx="10" fill="#F1F3F6" stroke="#E4E7EC" stroke-width="1"/>
      <text x="297.0" y="179" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" fill="#9AA1AC">zcode</text>
      <line x1="266.0" y1="175" x2="328.0" y2="175" stroke="#C4CAD5" stroke-width="1.6"/>
    </g>
    <g id="chip-tierflow">
      <rect x="380" y="150" width="150" height="46" rx="10" fill="#F1F3F6" stroke="#E4E7EC" stroke-width="1"/>
      <text x="455.0" y="179" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" fill="#9AA1AC">tierflow</text>
      <line x1="407.8" y1="175" x2="502.2" y2="175" stroke="#C4CAD5" stroke-width="1.6"/>
    </g>
    <g id="chip-opencsg">
      <rect x="538" y="150" width="150" height="46" rx="10" fill="#F1F3F6" stroke="#E4E7EC" stroke-width="1"/>
      <text x="613.0" y="179" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" fill="#9AA1AC">opencsg</text>
      <line x1="571.2" y1="175" x2="654.8" y2="175" stroke="#C4CAD5" stroke-width="1.6"/>
    </g>
  </g>

  <g id="arrow">
    <line x1="838" y1="173" x2="906" y2="173" stroke="#6B7280" stroke-width="2"/>
    <path d="M906 173 l-13 -8 v16 z" fill="#6B7280"/>
  </g>

  <g id="kept">
    <rect x="936" y="145" width="184" height="56" rx="12" fill="#EEF3FF" stroke="#B9CCFF" stroke-width="1.5"/>
    <text x="1028" y="171" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" fill="#1E4FD8">tokenrhythm</text>
    <text x="1028" y="191" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5B7BD8">保留</text>
  </g>

  <g id="facts">
    <circle cx="56" cy="245" r="3.5" fill="#3B6CF6"/>
    <text x="76" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3B424E">删除 4 个模块文件、4 组路由（请求返回 404）、4 个设置页签</text>
    <circle cx="56" cy="289" r="3.5" fill="#3B6CF6"/>
    <text x="76" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3B424E">出网域名从 8 条降到 4 条，不再触碰另外四家的任何主机</text>
    <circle cx="56" cy="333" r="3.5" fill="#3B6CF6"/>
    <text x="76" y="339" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3B424E">SYS_KEYS 收窄为 ['tr']，四家的会话池与净化器随代码一起删掉</text>
  </g>
</svg>
